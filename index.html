<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minowa Veículos</title>
  <!-- Biblioteca para gerar PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    /* ===== Variáveis ===== */
    :root {
      --bg-page: #0c0c0d;
      --bg-card: #161617;
      --border: #262627;
      --text-primary: #f5f5f5;
      --text-secondary: #9a9a9c;
      --accent: #e0263c;
    }

    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    a {
      text-decoration: none;
      color: var(--text-secondary);
    }
    .hidden {
      display: none !important;
    }

    /* ===== Auth ===== */
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-card {
      width: 100%;
      max-width: 360px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      display: flex;
      flex-direction: column;
    }
    .brand {
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 2px;
    }
    .brand-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 28px;
    }
    .auth-title {
      font-size: 20px;
      margin: 16px 0 20px;
    }
    .auth-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      margin-top: 12px;
    }
    .auth-input {
      background: var(--bg-page);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }
    .auth-input:focus {
      border-color: var(--accent);
    }
    .auth-button {
      margin-top: 24px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .auth-button:hover {
      opacity: 0.85;
    }
    .auth-error {
      color: #ff5c5c;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    /* ===== Layout ===== */
    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* ===== Sidebar ===== */
    .sidebar {
      width: 220px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .sidebar .brand {
      margin-bottom: 2px;
    }
    .sidebar .brand-sub {
      margin-bottom: 28px;
    }
    .nav-item {
      display: block;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 4px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .nav-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
    }
    .nav-item.active {
      background: rgba(224, 38, 60, 0.15);
      color: var(--accent);
    }
    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
    .logout-button {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .logout-button:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
    }

    /* ===== Main ===== */
    .main {
      flex: 1;
      padding: 32px 40px;
      overflow-x: auto;
    }
    .page-title {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 4px;
    }
    .page-subtitle {
      color: var(--text-secondary);
      margin: 0 0 24px;
      font-size: 14px;
    }
    .page-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:hover {
      opacity: 0.85;
    }
    .btn-secondary {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.04);
      color: var(--text-primary);
    }
    .btn-whatsapp {
      background: #25d366;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-whatsapp:hover {
      opacity: 0.8;
    }
    .btn-pdf {
      background: #ff6b6b;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-pdf:hover {
      opacity: 0.8;
    }

    /* ===== Cards ===== */
    .cards-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      flex: 1;
      min-width: 160px;
    }
    .card-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .card-value {
      font-size: 30px;
      font-weight: 700;
    }

    /* ===== Tabelas ===== */
    .table-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: auto;
      margin-top: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 600px;
    }
    th {
      text-align: left;
      padding: 14px 16px;
      color: var(--text-secondary);
      font-weight: 500;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .badge {
      display: inline-block;
      background: rgba(224, 38, 60, 0.15);
      color: var(--accent);
      padding: 2px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-success {
      background: rgba(46, 204, 113, 0.15);
      color: #2ecc71;
    }

    /* ===== Formulários ===== */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .form-grid input, .form-grid select, .form-grid textarea {
      background: var(--bg-page);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      width: 100%;
      font-family: inherit;
    }
    .form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus {
      border-color: var(--accent);
    }
    .form-grid label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 4px;
      display: block;
    }
    .form-grid .full-width {
      grid-column: 1 / -1;
    }
    .form-grid .half-width {
      grid-column: span 2;
    }
    .form-actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .img-preview {
      max-width: 120px;
      max-height: 80px;
      border-radius: 6px;
      object-fit: cover;
    }

    /* ===== Responsivo ===== */
    @media (max-width: 900px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    @media (max-width: 700px) {
      .sidebar { width: 180px; padding: 16px 12px; }
      .main { padding: 20px; }
      .form-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 550px) {
      .layout { flex-direction: column; }
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
        flex-direction: row;
        flex-wrap: wrap;
        padding: 12px 16px;
        align-items: center;
      }
      .sidebar .brand-sub { margin-bottom: 0; margin-left: 6px; }
      .sidebar .nav {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        order: 3;
        width: 100%;
        margin-top: 8px;
      }
      .sidebar .nav-item { padding: 6px 12px; font-size: 13px; }
      .sidebar-footer { border-top: none; padding-top: 0; margin-left: auto; }
      .main { padding: 16px; }
      .cards-row { gap: 12px; }
      .card { min-width: 120px; padding: 16px; }
    }

    /* Estilo para o contrato em PDF */
    .contrato-pdf {
      font-family: Arial, sans-serif;
      background: white;
      color: black;
      padding: 40px;
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .contrato-pdf h1 {
      text-align: center;
      font-size: 22px;
      text-transform: uppercase;
      border-bottom: 2px solid #000;
      padding-bottom: 10px;
    }
    .contrato-pdf .dados {
      margin: 20px 0;
    }
    .contrato-pdf .dados table {
      width: 100%;
      border-collapse: collapse;
      min-width: auto;
    }
    .contrato-pdf .dados td {
      padding: 6px 10px;
      border: 1px solid #333;
    }
    .contrato-pdf .clausula {
      margin: 18px 0;
    }
    .contrato-pdf .clausula strong {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }
    .contrato-pdf .assinatura {
      margin-top: 40px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="page-login" class="auth-page">
  <div class="auth-card">
    <div class="brand">MINOWA</div>
    <div class="brand-sub">Revenda de Veículos</div>
    <h1 class="auth-title">Acesso Administrativo</h1>
    <label class="auth-label">E-mail</label>
    <input class="auth-input" id="login-email" type="email" value="diegoveiculocar@gmail.com" />
    <label class="auth-label">Senha</label>
    <input class="auth-input" id="login-password" type="password" value="minowaveiculos" />
    <div class="auth-error" id="login-error">Credenciais inválidas.</div>
    <button class="auth-button" id="login-btn">Entrar</button>
  </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="page-dashboard" class="layout hidden">
  <aside class="sidebar">
    <div>
      <div class="brand">MINOWA</div>
      <div class="brand-sub">Revenda</div>
      <nav class="nav">
        <div class="nav-item active" data-page="dashboard">Dashboard</div>
        <div class="nav-item" data-page="leads">Leads</div>
        <div class="nav-item" data-page="veiculos">Veículos</div>
        <div class="nav-item" data-page="clientes">Clientes</div>
        <div class="nav-item" data-page="vendas">Vendas</div>
      </nav>
    </div>
    <div class="sidebar-footer">
      <button class="logout-button" id="logout-btn">Sair</button>
    </div>
  </aside>
  <main class="main" id="main-content"></main>
</div>

<script>
  (function() {
    'use strict';

    // ============================
    //  AUTENTICAÇÃO
    // ============================
    const ADMIN_EMAIL = 'diegoveiculocar@gmail.com';
    const ADMIN_PASS = 'minowaveiculos';

    const pageLogin = document.getElementById('page-login');
    const pageDashboard = document.getElementById('page-dashboard');
    const mainContent = document.getElementById('main-content');
    const loginError = document.getElementById('login-error');

    function showLogin() {
      pageLogin.classList.remove('hidden');
      pageDashboard.classList.add('hidden');
    }
    function showDashboard() {
      pageLogin.classList.add('hidden');
      pageDashboard.classList.remove('hidden');
      renderPage('dashboard');
    }

    document.getElementById('login-btn').addEventListener('click', function(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value.trim();
      if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
        loginError.style.display = 'none';
        showDashboard();
      } else {
        loginError.style.display = 'block';
      }
    });

    document.getElementById('logout-btn').addEventListener('click', showLogin);

    // ============================
    //  NAVEGAÇÃO
    // ============================
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
      item.addEventListener('click', function() {
        navItems.forEach(n => n.classList.remove('active'));
        this.classList.add('active');
        renderPage(this.dataset.page);
      });
    });

    // ============================
    //  DADOS (localStorage)
    // ============================
    function getData(key) {
      return JSON.parse(localStorage.getItem(key)) || [];
    }
    function setData(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }

    // Listas pré-definidas
    const MARCAS = ['Fiat', 'Volkswagen', 'Chevrolet', 'Ford', 'Toyota', 'Honda', 'Hyundai', 'Nissan', 'Renault', 'Peugeot', 'Citroën', 'Jeep', 'Mitsubishi', 'Suzuki', 'Kia', 'BMW', 'Mercedes-Benz', 'Audi', 'Volvo', 'Land Rover'];
    const MODELOS_BY_MARCA = {
      'Fiat': ['Uno', 'Palio', 'Strada', 'Toro', 'Argo', 'Cronos', 'Mobi', 'Pulse', 'Fastback'],
      'Volkswagen': ['Gol', 'Polo', 'Virtus', 'T-Cross', 'Nivus', 'Taos', 'Saveiro', 'Amarok', 'Golf'],
      'Chevrolet': ['Onix', 'Prisma', 'Cruze', 'Tracker', 'Equinox', 'S10', 'Spin', 'Celta'],
      'Ford': ['Ka', 'Fiesta', 'Focus', 'EcoSport', 'Ranger', 'Bronco', 'Mustang'],
      'Toyota': ['Corolla', 'Yaris', 'Hilux', 'SW4', 'Etios', 'Camry', 'RAV4'],
      'Honda': ['Civic', 'Fit', 'HR-V', 'CR-V', 'City', 'WR-V'],
      'Hyundai': ['HB20', 'Creta', 'Tucson', 'Santa Fe', 'Azera'],
      'Nissan': ['Kicks', 'Versa', 'Sentra', 'Frontier', 'Leaf'],
      'Renault': ['Kwid', 'Sandero', 'Logan', 'Duster', 'Captur', 'Oroch'],
      'Peugeot': ['208', '2008', '3008', 'Partner'],
      'Citroën': ['C3', 'Aircross', 'C4 Cactus', 'Jumpy'],
      'Jeep': ['Renegade', 'Compass', 'Commander', 'Wrangler'],
      'Mitsubishi': ['Lancer', 'Outlander', 'Pajero', 'Eclipse Cross'],
      'Suzuki': ['Jimny', 'Vitara', 'Swift'],
      'Kia': ['Sportage', 'Sorento', 'Cerato', 'Stinger'],
      'BMW': ['X1', 'X3', 'X5', 'Série 3', 'Série 5'],
      'Mercedes-Benz': ['Classe A', 'Classe C', 'GLA', 'GLC', 'GLE'],
      'Audi': ['A3', 'A4', 'Q3', 'Q5', 'Q7'],
      'Volvo': ['XC40', 'XC60', 'XC90', 'S60'],
      'Land Rover': ['Evoque', 'Discovery', 'Range Rover']
    };

    const CORES = ['Branco', 'Preto', 'Prata', 'Cinza', 'Vermelho', 'Azul', 'Verde', 'Amarelo', 'Laranja', 'Marrom', 'Bege', 'Rosa', 'Roxo', 'Dourado', 'Chumbo'];
    const COMBUSTIVEIS = ['Gasolina', 'Álcool', 'Flex', 'Diesel', 'Elétrico', 'Híbrido'];

    // Inicializa dados de exemplo
    function initData() {
      if (!localStorage.getItem('veiculos')) {
        setData('veiculos', [
          { id: 1, marca: 'Fiat', modelo: 'Toro', ano: '2022', cor: 'Prata', combustivel: 'Flex', km: 30000, placa: 'ABC-1234', renavam: '12345678901', chassi: '9BD12345678901234', valor: '115000', descricao: 'Único dono, revisões em dia', foto: '', crv: '', status: 'disponivel' },
          { id: 2, marca: 'Volkswagen', modelo: 'Golf', ano: '2021', cor: 'Vermelho', combustivel: 'Gasolina', km: 45000, placa: 'DEF-5678', renavam: '98765432109', chassi: '9BD98765432109876', valor: '98000', descricao: 'Completo, automático', foto: '', crv: '', status: 'disponivel' }
        ]);
      }
      if (!localStorage.getItem('clientes')) {
        setData('clientes', [
          { id: 1, nome: 'Carlos Silva', telefone: '(11) 99999-1111', email: 'carlos@email.com', dataNasc: '1985-05-10', profissao: 'Engenheiro', endereco: 'Rua A, 123', bairro: 'Centro', cidade: 'São Paulo', cep: '01000-000', uf: 'SP', habilitado: true },
          { id: 2, nome: 'Mariana Lima', telefone: '(11) 99999-2222', email: 'mariana@email.com', dataNasc: '1990-08-22', profissao: 'Arquiteta', endereco: 'Av B, 456', bairro: 'Jardim', cidade: 'São Paulo', cep: '02000-000', uf: 'SP', habilitado: false }
        ]);
      }
      if (!localStorage.getItem('leads')) {
        setData('leads', [
          { id: 1, nome: 'João Souza', telefone: '(11) 98888-7777', origem: 'OLX', status: 'novo' },
          { id: 2, nome: 'Ana Costa', telefone: '(11) 97777-6666', origem: 'Instagram', status: 'contatado' }
        ]);
      }
      if (!localStorage.getItem('vendas')) {
        setData('vendas', [
          { id: 1, veiculoId: 1, clienteId: 1, data: '2026-07-20', valor: '115000' }
        ]);
        let veiculos = getData('veiculos');
        veiculos = veiculos.map(v => v.id === 1 ? { ...v, status: 'vendido' } : v);
        setData('veiculos', veiculos);
      }
    }
    initData();

    // ============================
    //  RENDERIZAÇÃO DAS PÁGINAS
    // ============================
    function renderPage(page) {
      let html = '';
      switch (page) {
        case 'dashboard': html = renderDashboard(); break;
        case 'leads': html = renderLeads(); break;
        case 'veiculos': html = renderVeiculos(); break;
        case 'clientes': html = renderClientes(); break;
        case 'vendas': html = renderVendas(); break;
        default: html = '<p>Página não encontrada.</p>';
      }
      mainContent.innerHTML = html;
      attachEvents(page);
    }

    // ============================
    //  DASHBOARD
    // ============================
    function renderDashboard() {
      const veiculos = getData('veiculos');
      const clientes = getData('clientes');
      const leads = getData('leads');
      const vendas = getData('vendas');
      const disponiveis = veiculos.filter(v => v.status === 'disponivel').length;

      return `
        <h1 class="page-title">Dashboard</h1>
        <p class="page-subtitle">Visão geral da revenda</p>
        <div class="cards-row">
          <div class="card"><div class="card-label">Veículos disponíveis</div><div class="card-value">${disponiveis}</div></div>
          <div class="card"><div class="card-label">Clientes cadastrados</div><div class="card-value">${clientes.length}</div></div>
          <div class="card"><div class="card-label">Vendas realizadas</div><div class="card-value">${vendas.length}</div></div>
          <div class="card"><div class="card-label">Leads ativos</div><div class="card-value">${leads.length}</div></div>
        </div>
        <h2 style="font-size:18px; margin-top: 20px;">Últimas vendas</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Veículo</th><th>Cliente</th><th>Data</th><th>Valor</th></tr></thead>
            <tbody>
              ${vendas.slice(-3).reverse().map(v => {
                const veic = veiculos.find(x => x.id === v.veiculoId);
                const cli = clientes.find(x => x.id === v.clienteId);
                return `<tr><td>${veic ? veic.marca+' '+veic.modelo : 'N/A'}</td><td>${cli ? cli.nome : 'N/A'}</td><td>${v.data}</td><td>R$ ${v.valor}</td></tr>`;
              }).join('') || '<tr><td colspan="4">Nenhuma venda registrada.</td></tr>'}
            </tbody>
          </table>
        </div>
      `;
    }

    // ============================
    //  LEADS
    // ============================
    function renderLeads() {
      const leads = getData('leads');
      const statusOptions = ['novo', 'contatado', 'negociação', 'perdido', 'convertido'];
      let html = `
        <div class="page-header-row">
          <div><h1 class="page-title">Leads</h1><p class="page-subtitle">Potenciais clientes</p></div>
          <button class="btn-primary" onclick="abrirFormLead()">+ Novo Lead</button>
        </div>
        <div id="form-lead" class="form-grid hidden">
          <div><label>Nome</label><input id="lead-nome" placeholder="Nome completo" /></div>
          <div><label>Telefone</label><input id="lead-telefone" placeholder="(00) 00000-0000" /></div>
          <div><label>Origem</label>
            <select id="lead-origem"><option>OLX</option><option>Facebook</option><option>Instagram</option><option>WhatsApp</option><option>Outro</option></select>
          </div>
          <div><label>Status</label>
            <select id="lead-status">${statusOptions.map(s => `<option>${s}</option>`).join('')}</select>
          </div>
          <div class="form-actions">
            <button class="btn-secondary" onclick="cancelarFormLead()">Cancelar</button>
            <button class="btn-primary" id="salvar-lead">Salvar</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>

    let editLeadId = null;
    window.abrirFormLead = function(id) {
      const form = document.getElementById('form-lead');
      form.classList.remove('hidden');
      if (id) {
        const leads = getData('leads');
        const lead = leads.find(l => l.id === id);
        if (lead) {
          document.getElementById('lead-nome').value = lead.nome;
          document.getElementById('lead-telefone').value = lead.telefone;
          document.getElementById('lead-origem').value = lead.origem;
          document.getElementById('lead-status').value = lead.status;
          editLeadId = id;
        }
      } else {
        document.getElementById('lead-nome').value = '';
        document.getElementById('lead-telefone').value = '';
        document.getElementById('lead-origem').value = 'OLX';
        document.getElementById('lead-status').value = 'novo';
        editLeadId = null;
      }
    };
    window.cancelarFormLead = function() {
      document.getElementById('form-lead').classList.add('hidden');
      editLeadId = null;
    };
    window.excluirLead = function(id) {
      if (confirm('Remover este lead?')) {
        let leads = getData('leads');
        leads = leads.filter(l => l.id !== id);
        setData('leads', leads);
        renderPage('leads');
      }
    };
    window.editarLead = function(id) {
      abrirFormLead(id);
    };

    document.addEventListener('click', function(e) {
      if (e.target.id === 'salvar-lead') {
        const nome = document.getElementById('lead-nome').value.trim();
        const telefone = document.getElementById('lead-telefone').value.trim();
        const origem = document.getElementById('lead-origem').value;
        const status = document.getElementById('lead-status').value;
        if (!nome || !telefone) return alert('Preencha nome e telefone.');
        let leads = getData('leads');
        if (editLeadId) {
          leads = leads.map(l => l.id === editLeadId ? { ...l, nome, telefone, origem, status } : l);
        } else {
          const newId = leads.length ? Math.max(...leads.map(l => l.id)) + 1 : 1;
          leads.push({ id: newId, nome, telefone, origem, status });
        }
        setData('leads', leads);
        cancelarFormLead();
        renderPage('leads');
      }
    });

    window.simularOCR = function() {
      const marcas = MARCAS;
      const marca = marcas[Math.floor(Math.random() * marcas.length)];
      const modelos = MODELOS_BY_MARCA[marca] || ['Modelo'];
      const modelo = modelos[Math.floor(Math.random() * modelos.length)];
      const ano = (2020 + Math.floor(Math.random() * 6)).toString();
      const cor = CORES[Math.floor(Math.random() * CORES.length)];
      const combustivel = COMBUSTIVEIS[Math.floor(Math.random() * COMBUSTIVEIS.length)];
      const km = (Math.floor(Math.random() * 80000) + 10000).toString();
      const placa = String.fromCharCode(65 + Math.floor(Math.random()*26)) + 
                    String.fromCharCode(65 + Math.floor(Math.random()*26)) + 
                    String.fromCharCode(65 + Math.floor(Math.random()*26)) + '-' +
                    (1000 + Math.floor(Math.random()*9000)).toString();
      const renavam = (10000000000 + Math.floor(Math.random()*90000000000)).toString().slice(0,11);
      const chassi = '9BD' + (100000000000000 + Math.floor(Math.random()*900000000000000)).toString().slice(0,14);
      const valor = (50000 + Math.floor(Math.random()*150000)).toString();

      const marcaSelect = document.getElementById('veic-marca');
      marcaSelect.value = marca;
      const evt = new Event('change');
      marcaSelect.dispatchEvent(evt);
      document.getElementById('veic-modelo').value = modelo;
      document.getElementById('veic-ano').value = ano;
      document.getElementById('veic-cor').value = cor;
      document.getElementById('veic-combustivel').value = combustivel;
      document.getElementById('veic-km').value = km;
      document.getElementById('veic-placa').value = placa;
      document.getElementById('veic-renavam').value = renavam;
      document.getElementById('veic-chassi').value = chassi;
      document.getElementById('veic-valor').value = valor;
      document.getElementById('veic-desc').value = 'Veículo reconhecido automaticamente.';
      alert('Dados simulados preenchidos! (Isso é apenas uma demonstração. Em produção, use uma API de OCR real.)');
    };

        document.getElementById('cli-uf').value = '';
        document.getElementById('cli-habilitado').checked = false;
        editClienteId = null;
      }
    };
    window.cancelarFormCliente = function() {
      document.getElementById('form-cliente').classList.add('hidden');
      editClienteId = null;
    };
    window.excluirCliente = function(id) {
      if (confirm('Remover este cliente?')) {
        let clientes = getData('clientes');
        clientes = clientes.filter(c => c.id !== id);
        setData('clientes', clientes);
        renderPage('clientes');
      }
    };
    window.editarCliente = function(id) {
      abrirFormCliente(id);
    };

    document.addEventListener('click', function(e) {
      if (e.target.id === 'salvar-cliente') {
        const nome = document.getElementById('cli-nome').value.trim();
        const telefone = document.getElementById('cli-telefone').value.trim();
        const email = document.getElementById('cli-email').value.trim();
        const dataNasc = document.getElementById('cli-data-nasc').value;
        const profissao = document.getElementById('cli-profissao').value.trim();
        const endereco = document.getElementById('cli-endereco').value.trim();
        const bairro = document.getElementById('cli-bairro').value.trim();
        const cidade = document.getElementById('cli-cidade').value.trim();
        const cep = document.getElementById('cli-cep').value.trim();
        const uf = document.getElementById('cli-uf').value.trim().toUpperCase();
        const habilitado = document.getElementById('cli-habilitado').checked;

        if (!nome || !telefone || !email) return alert('Preencha nome, telefone e e-mail.');
        let clientes = getData('clientes');
        if (editClienteId) {
          clientes = clientes.map(c => c.id === editClienteId ? { ...c, nome, telefone, email, dataNasc, profissao, endereco, bairro, cidade, cep, uf, habilitado } : c);
        } else {
          const newId = clientes.length ? Math.max(...clientes.map(c => c.id)) + 1 : 1;
          clientes.push({ id: newId, nome, telefone, email, dataNasc, profissao, endereco, bairro, cidade, cep, uf, habilitado });
        }
        setData('clientes', clientes);
        cancelarFormCliente();
        renderPage('clientes');
      }
    });

    // ---- VENDAS ----
    window.abrirFormVenda = function() {
      document.getElementById('form-venda').classList.remove('hidden');

      document.getElementById('venda-valor').value = '';
    };
    window.cancelarFormVenda = function() {
      document.getElementById('form-venda').classList.add('hidden');
    };
    window.excluirVenda = function(id) {
      if (confirm('Excluir esta venda? O veículo voltará ao estoque.')) {
        let vendas = getData('vendas');
        const venda = vendas.find(v => v.id === id);
        if (venda) {
          let veiculos = getData('veiculos');
          veiculos = veiculos.map(v => v.id === venda.veiculoId ? { ...v, status: 'disponivel' } : v);
          setData('veiculos', veiculos);
        }
        vendas = vendas.filter(v => v.id !== id);
        setData('vendas', vendas);
        renderPage('vendas');
      }
    };

    document.addEventListener('click', function(e) {
      if (e.target.id === 'salvar-venda') {

        const clienteId = parseInt(document.getElementById('venda-cliente').value);
        const data = document.getElementById('venda-data').value;
        const valor = document.getElementById('venda-valor').value.trim();
        if (!veiculoId || !clienteId || !data || !valor) return alert('Preencha todos os campos.');
        let veiculos = getData('veiculos');
        const veic = veiculos.find(v => v.id === veiculoId);
        if (!veic || veic.status !== 'disponivel') return alert('Veículo não está mais disponível.');
        let vendas = getData('vendas');
        const newId = vendas.length ? Math.max(...vendas.map(v => v.id)) + 1 : 1;
        vendas.push({ id: newId, veiculoId, clienteId, data, valor });
        setData('vendas', vendas);
        veiculos = veiculos.map(v => v.id === veiculoId ? { ...v, status: 'vendido' } : v);
        setData('veiculos', veiculos);
        cancelarFormVenda();
        renderPage('vendas');
      }
    });

    //  GERAR CONTRATO EM PDF

            </table>
            <p>O pagamento se dará da seguinte forma: <em>${venda.valor} em parcela única.</em></p>

          <div class="clausula">

            <p>A partir da assinatura deste contrato, o COMPRADOR se responsabiliza por quaisquer danos, seja no âmbito civil ou criminal, decorrente da utilização do veículo ora adquirido, inclusive multas e pontuações na CNH decorrentes de tais infrações, sejam elas de âmbito Municipal, Estadual e ou Federal, bem como, fica responsável também, nos mesmos termos acima, até a presente data e hora, por eventual veículo dado na compra do objeto do presente, respondendo ainda o comprador, pela evicção e eventuais vícios redibitórios do mesmo. O VENDEDOR, acaso tenha recebido algum veículo do COMPRADOR, como forma de pagamento do bem objeto do presente, fica responsável, por quaisquer danos, seja no âmbito civil ou penal, decorrente da utilização do veículo ora recebido, inclusive multas e pontuações na CNH decorrentes de tais infrações, sejam elas de âmbito Municipal, Estadual e ou Federal;</p>
            <p>Deste modo, o presente instrumento é firmado nos termos do artigo 784, III do CPC, razão pela qual é um título executivo extrajudicial, mesmo porque, o "quantum debeatur" depende de simples cálculo aritmético, a partir de dados consignados em documentos comprobatórios do débito (multas de trânsito, IPVA, licenciamento e outros).</p>

            <p>Para os veículos usados a VENDEDORA fornece a garantia pelo tempo exigido por lei (90 dias), e somente para os componentes internos de motor e caixa de câmbio, contudo, a mesma estará automaticamente cancelada, no caso de mau uso do veículo em questão, em caso deste último ter suas características originais (as quais são especificadas pelo fabricante do manual do veículo), alteradas, bem como, quando o mesmo for utilizado fora dos padrões e ou limites de carga e/ou de rotação especificados pelo fabricantes ou ainda, se for utilizado em competições de qualquer espécie ou natureza, além do que, se tiver sua manutenção negligenciada.</p>
            <p>Todo e qualquer serviço e ou conserto coberto por esta garantia deverá ser executado por assistência técnica ou oficina mecânica indicada por esta VENDEDORA e somente após orçamento aprovado pela VENDEDORA; Qualquer manutenção feita pelo COMPRADOR em oficina própria do mesmo, não será ressarcido pelo VENDEDOR; Para os veículos novos, isto é, OKM, a garantia é a de fábrica.</p>
            <p>Ficam de fora da presente garantia, os componentes eletroeletrônicos e do sistema de arrefecimento do veículo, como por exemplo: sensores, módulos em geral, centrais, mangueiras, bomba d'água, fiações, etc.</p>

            <p>Estão fora da presente garantia, itens de desgaste natural e vida útil predeterminados, tais como: discos e platô de embreagem, discos, tambores, pastilhas e lonas de freio, cabos de vela, correias em geral, bateria, amortecedores e molas, entre outros, incluindo-se ainda os itens considerados de manutenção normal, como limpeza de bicos injetores, fluídos e óleos em geral.</p>
            <p>A garantia das peças eventualmente substituídas na vigência deste, finda-se com o término do mesmo. Todo e qualquer custo não relacionado diretamente com a garantia do veículo, tais como despesas com táxi, guincho, alimentação, hospedagem etc., não é de responsabilidade da VENDEDORA.</p>

            <p>Fica desde já avençado entre estas partes, que na hipótese de resolução do contrato, em se tratando de veículo usado, o COMPRADOR deverá pagar ao VENDEDOR, até a devolução do bem objeto deste instrumento, o valor diário pelo uso do veículo, na base de 0,5% (meio por cento) sobre o valor do mesmo, em se tratando de veículo novo (0 Km), o COMPRADOR deverá pagar ao VENDEDOR, até a devolução do bem objeto deste instrumento, o valor diário pelo uso do veículo, na base de 0,5% (meio por cento) sobre o valor do bem, mais o valor decorrente da depreciação sofrida pelo veículo em razão de não ser mais o mesmo um bem 0Km, servindo-se para tal verificação (depreciação), a tabela FIPE atualizada.</p>

          <div class="clausula">
            <strong>CLÁUSULA SÉTIMA – DO DEPÓSITO</strong>
            <p>Nos termos do que estabelece o artigo 629 do Código Civil, o COMPRADOR assume, de forma gratuita, a condição de depositário do bem objeto do presente, obrigando-se pela guarda e conservação dele, até o integral pagamento do preço.</p>
          </div>

          <div class="clausula">
            <strong>CLÁUSULA OITAVA – LEI GERAL DE PROTEÇÃO DE DADOS</strong>
            <p>A empresa VENDEDORA em questão, está em conformidade com a Lei 13.709/2018 - LGPD, protegendo os direitos fundamentais de liberdade e de privacidade e o livre desenvolvimento da personalidade da pessoa natural no que diz respeito às operações realizadas com os dados pessoais armazenados de forma física ou digital ora fornecidos para o fim de elaborar este documento e realizar os trâmites necessários para a perfeita prestação de serviços contratada em questão.</p>
            <p>Em respeito ao artigo 7°, inciso I e artigo 8°, § 1° da aludida Lei, tais dados serão utilizados somente, e tão somente, com a finalidade de manutenção necessária para este contrato, estando o titular autorizando e dando sua ciência de fornecimento para este fim específico.</p>

      // Criar um container visível para o PDF

      container.style.display = 'flex';
      container.style.alignItems = 'center';
      container.style.justifyContent = 'center';
      container.style.overflow = 'auto';
      container.innerHTML = `<div style="background:white; padding:20px; border-radius:8px; max-width:800px; max-height:90vh; overflow:auto;">${contratoHTML}</div>`;

      // Gerar PDF a partir do conteúdo visível

        margin:        [0.5, 0.5, 0.5, 0.5],
        filename:     `Contrato_Venda_${veic.modelo}_${cli.nome}.pdf`,

        html2canvas:  { scale: 2, letterRendering: true },

      };
      html2pdf().set(opt).from(element).save().then(() => {
        document.body.removeChild(container);
      }).catch(err => {
        console.error(err);
        alert('Erro ao gerar PDF. Tente novamente.');
        document.body.removeChild(container);
      });
